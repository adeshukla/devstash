name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # 22 (not 20): the unit tests import .ts files directly via Node's built-in
          # type stripping, which Node 20 does not have.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      - name: ESLint (zero warnings allowed)
        run: pnpm lint

      - name: Unit and content tests
        run: pnpm test:unit

  content-checks:
    name: Content Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint MDX frontmatter
        run: pnpm lint:content

      - name: Check project longDescription compiles as MDX
        run: pnpm check:project-mdx

      - name: Check internal links
        run: pnpm check:links

      - name: Guard against unoptimized images
        run: pnpm check:images

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      # Shallow checkout (default depth) on purpose: gitleaks scans the git
      # history it can see. Known-old, already-rotated secrets from before
      # this job existed live deeper in history (see CLAUDE.md Known Issues);
      # re-flagging those forever without a history rewrite isn't useful, so
      # this job is scoped to catching *new* leaks in the current commit.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: .env.example must not contain real secrets
        run: pnpm check:env-example

      - name: Dependency vulnerability audit (high/critical)
        run: pnpm audit:deps

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://devstash.me

  # Release gate only: layout must not overflow from 200px to 1440px on any key
  # route. Runs on pull requests into main so ordinary dev pushes stay fast.
  responsive:
    name: Responsive QA
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Test the production build, not a cold dev server: dev compiles each of
      # the 17 routes on first hit and times out under parallel workers.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://devstash.me

      - name: Start the built site
        run: |
          pnpm start &
          timeout 90 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 2; done'

      - name: No horizontal overflow, 200px to 1440px
        run: pnpm qa:responsive
        env:
          QA_BASE_URL: http://localhost:3000
