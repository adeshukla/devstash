packages:
  - '.'
allowBuilds:
  sharp: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Forces patched versions of transitive deps pulled in only by
# devDependencies (@lhci/cli's inquirer/tmp/socks chain, eslint's own
# minimatch) that `pnpm audit --audit-level=high` flags as high-severity.
# None of these are reachable from anything that ships — dev/CI tooling
# only — but the audit gate doesn't distinguish, so pin here instead of
# accepting a red CI check.
overrides:
  tmp: '>=0.2.6'
  # Upper-bounded to stay in the v1.x line: an open '>=1.1.16' floor let pnpm
  # jump to 5.x, which broke `pnpm lint` outright — eslint's own
  # @eslint/config-array uses minimatch@3, whose braceExpand() calls
  # brace-expansion with the old v1.x call shape; v5 changed it and threw
  # "expand is not a function". Patched-and-compatible, not just patched.
  brace-expansion: '>=1.1.16 <2.0.0'
  ip-address: '>=10.3.1'
  # Same lesson, same fix: an open floor jumped js-yaml to 5.x and nanoid to
  # 6.x — real major bumps I hadn't vetted, well past what the advisory
  # asked for. js-yaml 4.x specifically removed the safeLoad()/safeDump()
  # API scripts/seo/check-metadata.mjs calls directly (gray-matter's own
  # usage was already on the modern load() API, which is why `pnpm build`
  # looked clean while `pnpm lint:content` was actually broken) — bounding
  # to the v3.x line sidesteps that without having to touch the script.
  js-yaml: '>=3.15.1 <4.0.0'
  postcss: '>=8.5.18'
  nanoid: '>=3.3.18 <4.0.0'
  sharp: '>=0.35.3'
  # extract-zip is NOT overridden: its advisory (GHSA-jmr9-qjv8-65gv) asks for
  # >=2.0.2, but 2.0.1 is still the latest version actually published to npm
  # — there's no real fix to pin to yet. Only reachable via @lhci/cli's
  # puppeteer/lighthouse chain (downloads/extracts a Chrome binary for
  # Lighthouse CI runs), never from anything that ships. Accepted, same as
  # the other transitive-only findings already accepted in this project's
  # history — revisit if/when a patched release actually exists.
