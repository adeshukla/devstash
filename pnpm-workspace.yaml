packages:
  - '.'
allowBuilds:
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Deliberately duplicated from package.json's "pnpm" field, not moved there
# instead of here: CI is pinned to pnpm 9, which only reads overrides from
# package.json (the pre-v10 location); local dev here runs pnpm 11, which
# only reads them from here and silently ignores package.json's "pnpm" key.
# Whichever version resolves first writes a lockfile whose overrides-hash
# the OTHER version won't recognize unless both compute the same effective
# set — hence keeping identical values in both files rather than picking
# one. If you change one, change both.
overrides:
  tmp: '>=0.2.6'
  brace-expansion: '>=1.1.16 <2.0.0'
  ip-address: '>=10.3.1'
  js-yaml: '>=3.15.1 <4.0.0'
  postcss: '>=8.5.18'
  nanoid: '>=3.3.18 <4.0.0'
  sharp: '>=0.35.3'
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
