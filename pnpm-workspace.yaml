packages:
  - '.'
allowBuilds:
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Deliberately duplicated from package.json's "pnpm" field, not moved there
# instead of here: CI is pinned to pnpm 9, which only reads overrides from
# package.json (the pre-v10 location); local dev here runs pnpm 11, which
# only reads them from here and silently ignores package.json's "pnpm" key.
# Whichever version resolves first writes a lockfile whose overrides-hash
# the OTHER version won't recognize unless both compute the same effective
# set — hence keeping identical values in both files rather than picking
# one. If you change one, change both.
overrides:
  tmp: '>=0.2.6'
  brace-expansion: '>=1.1.20 <2.0.0'
  ip-address: '>=10.3.1'
  js-yaml: '>=3.15.2 <4.0.0'
  postcss: '>=8.5.23'
  baseline-browser-mapping: '>=2.11.0'
  nanoid: '>=3.3.18 <4.0.0'
  sharp: '>=0.35.5'
  browserslist: '>=4.28.7'
  basic-ftp: '>=6.2.1'
  source-map-js: '>=1.2.2'
  proxy-addr: '>=2.0.8'
  compression: '>=1.8.2'
  body-parser: '>=1.20.9'
  zod: '>=4.6.6'
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    # extract-zip <=2.0.1 symlink write. No patched release exists (2.0.1 is the
    # latest). Reached only through @lhci/cli, a dev-only tool that never ships.
    - GHSA-7pqw-9j4j-h8q3
