<script type="text/x-dc" data-dc-script data-props='{"endFrame":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":560}}'>
class Component extends DCLogic {
  state = { show: true, paused: false };
  replay = () => {
    this.setState({ show: false, paused: false });
    setTimeout(() => this.setState({ show: true }), 60);
  };
  togglePause = () => this.setState({ paused: !this.state.paused });
  renderVals() {
    return {
      show: this.state.show,
      modeClass: (this.props.endFrame ? 'still' : '') + (this.state.paused ? ' paused' : ''),
      pauseLabel: this.state.paused ? 'Play' : 'Pause',
      togglePause: this.togglePause,
      replay: this.replay
    };
  }
}
</script>
